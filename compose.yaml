name: referral-copilot-local

services:
  postgres:
    image: postgres:16.6-alpine3.21
    env_file: .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    env_file: .env.docker
    environment:
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3100:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - next_cache:/app/.next
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    env_file: .env.docker
    command: ["npm", "run", "worker"]
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'scripts/intelligence-worker.ts' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  web_node_modules:
  worker_node_modules:
  next_cache:
